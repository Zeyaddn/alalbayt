name: Deploy Full Website to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./laravel-backend
        run: composer install --no-dev --optimize-autoloader

      - name: Build Next.js Frontend
        run: |
          cp deploy/next.config.production.ts next.config.ts
          export NODE_ENV=production
          export NEXT_PUBLIC_API_URL="http://albaytcharity.kesug.com/api"
          npm run build

      - name: Prepare & Rename _next to assets
        run: |
          # Rename _next to assets to avoid InfinityFree blocking underscore folders
          mv out/_next out/assets

          # Replace all /_next/ references with /assets/ in all files
          find out/ -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.txt" -o -name "*.xml" \) | while read f; do
            sed -i 's|/_next/|/assets/|g' "$f"
          done

          echo "Done fixing asset paths"

      - name: Prepare Frontend Zip
        run: |
          # Create frontend deploy.zip
          cd out
          zip -r ../frontend-deploy.zip . -x "*.git*"
          cd ..
          echo "Frontend zip size: $(du -sh frontend-deploy.zip | cut -f1)"

      - name: Prepare Backend Zip
        run: |
          # Create backend deploy.zip (inside htdocs/backend)
          cd laravel-backend
          zip -r ../backend-deploy.zip . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude "tests/*" \
            --exclude ".env" \
            --exclude ".env.backup"
          cd ..
          echo "Backend zip size: $(du -sh backend-deploy.zip | cut -f1)"

      - name: Create backend .env in zip
        run: |
          echo "${{ secrets.PRODUCTION_ENV }}" > .env.production.tmp
          zip backend-deploy.zip .env.production.tmp
          # We'll rename it server-side via extract script

      - name: Upload Frontend extractor + zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /htdocs/
          include: |
            frontend-deploy.zip
          exclude: |
            **/*

      - name: Upload Frontend extract.php via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-infinity/
          server-dir: /htdocs/
          include: |
            extract.php
          exclude: |
            **/*

      - name: Trigger Frontend Extraction
        run: |
          # Rename zip to deploy.zip on server side (expected by extractor)
          # First ping to test
          sleep 5
          curl -f "https://albaytcharity.kesug.com/extract.php?token=alalbayt_deploy_2026_secure&action=ping" || echo "Ping failed, trying anyway"
          # Trigger extraction - but first rename the zip
          curl -f "https://albaytcharity.kesug.com/extract.php?token=alalbayt_deploy_2026_secure&action=extract_named&zip=frontend-deploy.zip" || echo "Extract triggered"

      - name: Upload Backend zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /htdocs/backend/
          include: |
            backend-deploy.zip
          exclude: |
            **/*

      - name: Upload Backend extract.php via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-infinity/
          server-dir: /htdocs/backend/
          include: |
            extract.php
          exclude: |
            **/*

      - name: Trigger Backend Extraction
        run: |
          sleep 5
          curl -f "https://albaytcharity.kesug.com/backend/extract.php?token=alalbayt_deploy_2026_secure&action=ping" || echo "Backend ping failed"
          curl "https://albaytcharity.kesug.com/backend/extract.php?token=alalbayt_deploy_2026_secure&action=extract_named&zip=backend-deploy.zip" || echo "Backend extract triggered"
