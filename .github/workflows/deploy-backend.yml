name: Deploy Backend to InfinityFree

on:
  push:
    branches:
      - main
    paths:
      - 'laravel-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Install Composer Dependencies
        working-directory: ./laravel-backend
        run: composer install --no-dev --optimize-autoloader
        
      - name: Prepare Deployment Folder
        run: |
          mkdir -p deploy-temp
          # Copy all backend files
          cp -r laravel-backend/* deploy-temp/
          # Create required storage directories
          mkdir -p deploy-temp/storage/framework/cache/data
          mkdir -p deploy-temp/storage/framework/sessions
          mkdir -p deploy-temp/storage/framework/views
          mkdir -p deploy-temp/storage/logs
          # Create root .htaccess for InfinityFree
          echo "<IfModule mod_rewrite.c>" > deploy-temp/.htaccess
          echo "    RewriteEngine On" >> deploy-temp/.htaccess
          echo "    RewriteRule ^(.*)$ public/\$1 [L]" >> deploy-temp/.htaccess
          echo "</IfModule>" >> deploy-temp/.htaccess
          
      - name: Create .env File
        run: |
          echo "${{ secrets.PRODUCTION_ENV }}" > deploy-temp/.env
          
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-temp/
          server-dir: /htdocs/
          # Ignore .git and node_modules if any
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
